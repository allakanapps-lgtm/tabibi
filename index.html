dont:['لا تنزع جسماً غريباً مغروزاً في الجرح، ثبّته بالضمادات حوله.','لا تستخدم قطناً مباشرة على الجرح.','لا تقدّم له طعاماً أو شراباً.'],call:'نزيف لا يتوقف خلال 10 دقائق من الضغط، أو شحوب وبرودة ودوخة.',kw:'نزيف دم جرح عميق ضغط تورنيكيه'},
{id:'wound',c:'bleed',ic:'🩹',t:'جروح وخدوش بسيطة',sev:1,sum:'جرح سطحي أو خدش.',
steps:['اغسل يديك، ثم اضغط على الجرح بقماش نظيف حتى يتوقف النزيف.','اشطف الجرح بالماء الجاري النظيف لعدة دقائق لإزالة الأوساخ.','نظّف حول الجرح بالماء والصابون، دون فرك الجرح نفسه بقوة.','غطّه بضمادة نظيفة غير لاصقة بالجرح وغيّرها يومياً أو إذا تبللت.'],
dont:['لا تضع القهوة أو الطحين أو التراب أو الزبدة على الجرح.','لا تستخدم الكحول أو الماء الأكسجيني بشكل متكرر لأنها تؤخر الالتئام.'],call:'راجع الطبيب إذا كان الجرح عميقاً أو واسعاً أو متسخاً جداً أو ناتجاً عن عضة أو جسم صدئ، أو ظهرت حمرة وتورم وصديد أو حمى، أو لم يتلقَّ المصاب لقاح الكزاز منذ سنوات.',kw:'جرح خدش سحجة قطع'},
{id:'nose',c:'bleed',ic:'👃',t:'رعاف (نزيف الأنف)',sev:1,sum:'نزيف من الأنف.',
steps:['اجلس وانحنِ برأسك للأمام قليلاً (وليس للخلف).','اضغط الجزء اللين من الأنف (أسفل العظم) بإصبعين لمدة 10 دقائق متواصلة دون تفلّت.','تنفّس من الفم، ويمكن وضع كمادة باردة على الأنف والجبهة.','بعد التوقف تجنّب نفخ الأنف أو العبث به لساعات.'],
dont:['لا تُرجع رأسك للخلف لأن الدم يسيل في الحلق.','لا تحشُ الأنف بقطن عميق.'],call:'إذا استمر أكثر من 20 دقيقة، أو بعد إصابة قوية بالرأس، أو مع دوخة وشحوب.',kw:'رعاف نزيف انف دم من الانف'},
{id:'burn',c:'heat',ic:'🔥',t:'الحروق',sev:2,sum:'حرق بالنار أو السوائل الساخنة أو الأجسام الساخنة.',
steps:['أبعد المصاب عن مصدر الحرق، وأطفئ النار إن كانت على ملابسه (توقف، ارتمِ أرضاً، تدحرج).','برّد الحرق فوراً بماء جارٍ فاتر إلى بارد (ليس مثلجاً) لمدة 20 دقيقة.','انزع الخواتم والساعات والملابس غير الملتصقة قبل أن يتورم المكان.','غطّ الحرق بقماش نظيف أو غلاف بلاستيكي شفاف (كيس) غير ملتصق.','اجعل المصاب دافئاً بينما تبرد منطقة الحرق فقط، وراقب علامات الصدمة.'],
dont:['لا تضع الثلج ولا معجون الأسنان ولا الزبدة ولا الزيت ولا البياض.','لا تفقأ الفقاعات.','لا تنزع ملابس ملتصقة بالجلد.'],call:'اتصل بالإسعاف أو اذهب للمستشفى: الحروق الأكبر من كف يد المصاب، حروق الوجه واليدين والمفاصل والمنطقة التناسلية، الحروق العميقة (بيضاء أو متفحمة)، حروق الأطفال وكبار السن، الحروق الكهربائية والكيميائية، أو استنشاق دخان.',
note:'الحرق الكيميائي: انزع الملابس الملوثة واشطف بماء جارٍ غزير لمدة 20 دقيقة على الأقل. الحرق الكيميائي الجاف: أزل المسحوق بفرشاة ثم اشطف.',kw:'حرق حروق نار ماء مغلي زيت ساخن'},
{id:'fract',c:'bone',ic:'🦴',t:'كسور وخلع والتواء',sev:2,sum:'ألم شديد وتورم وتشوّه وعدم القدرة على تحريك العضو.',
steps:['اجعل المصاب ثابتاً ولا تدعه يحرّك العضو المصاب.','أوقف أي نزيف بالضغط حول الكسر (لا على العظم البارز).','ثبّت العضو بجبيرة (قطعة خشب، لوح، مجلة ملفوفة) تشمل المفصل فوق وتحت الكسر، واربطها برفق.','تأكد من لون وحرارة وإحساس الأصابع أسفل الجبيرة، وأرخِ الرباط إذا ازرقّت أو خدرت.','ضع كمادة باردة ملفوفة بقماش على المنطقة 15 إلى 20 دقيقة لتخفيف التورم.','انقله للمستشفى، واتصل بالإسعاف إذا كان الكسر في الحوض أو الفخذ أو الظهر أو الرقبة.'],
dont:['لا تحاول إعادة العظم لمكانه.','لا تدلّك المكان.','لا تحرّك مصاباً بشبهة إصابة العمود الفقري إلا للضرورة القصوى.'],call:'كسر مفتوح (عظم ظاهر)، نزيف شديد، فقدان الإحساس، أو كسر الفخذ/الحوض/الرقبة/الظهر.',
note:'الالتواء البسيط: الراحة، كمادات باردة، ضمادة ضاغطة مرنة، رفع العضو. وإذا لم يستطع المصاب الاستناد على الطرف، فاعتبره كسراً حتى يثبت العكس.',kw:'كسر عظم خلع التواء جبيرة تورم'},
{id:'head',c:'bone',ic:'🤕',t:'إصابة الرأس',sev:2,sum:'ضربة على الرأس أو سقوط.',
steps:['اجعل المصاب هادئاً ومستلقياً ورأسه مرفوع قليلاً.','اضغط برفق على أي جرح نازف بقماش نظيف، دون الضغط على كسر ظاهر.','ضع كمادة باردة على الورم.','راقبه لمدة 24 ساعة على الأقل: الوعي، الكلام، الحركة، الاستفراغ.'],
dont:['لا تتركه ينام وحده بدون مراقبة في الساعات الأولى إذا ظهرت أعراض.','لا تهزّه بقوة.'],call:'اتصل بالإسعاف عند: فقدان الوعي ولو للحظات، استفراغ متكرر، صداع شديد متزايد، نعاس شديد أو ارتباك، تشنج، ضعف أو خدر في طرف، خروج دم أو سائل من الأذن أو الأنف، اختلاف حجم الحدقتين، أو إصابة عند طفل صغير.',kw:'رأس ضربة سقوط ارتجاج جمجمة'},
{id:'spine',c:'bone',ic:'🧍',t:'إصابة الرقبة أو العمود الفقري (شبهة)',sev:3,sum:'سقوط من ارتفاع أو حادث سير مع ألم في الرقبة أو الظهر أو خدر.',
steps:['اتصل بالإسعاف ولا تحرّك المصاب.','اطلب منه ألا يحرّك رأسه، وثبّت رأسه بيديك أو بملابس ملفوفة على الجانبين.','حافظ على استقامة الرأس والرقبة والجسم كوحدة واحدة.','راقب التنفس والوعي. إذا توقف التنفس، افتح الشدق برفع الفك دون إمالة الرأس، وإذا لم يفلح فأمِل الرأس بحذر للضرورة القصوى.'],
dont:['لا تسحبه من منطقة آمنة ما لم يكن في خطر مباشر (حريق، غرق، انهيار).','لا تنزع الخوذة إلا للضرورة القصوى.'],call:'دائماً.',kw:'عمود فقري رقبة ظهر شلل حادث سقوط'},
{id:'faint',c:'sudden',ic:'😵',t:'إغماء',sev:2,sum:'فقدان وعي مؤقت مع شحوب وتعرّق.',
steps:['اجعله مستلقياً على ظهره وارفع ساقيه نحو 30 سم.','فكّ الملابس الضيقة وأمّن تهوية جيدة.','تحقق من التنفس، وإذا لم يتنفس ابدأ الإنعاش القلبي الرئوي.','عند الاستيقاظ اجعله يجلس ببطء ثم يقف تدريجياً، ويشرب ماء إذا كان واعياً تماماً.','إذا تقيّأ أو لم يستيقظ: اقلبه على جنبه (وضعية الإفاقة).'],
dont:['لا تعطه شيئاً عن طريق الفم وهو فاقد الوعي.','لا تصفعه ولا ترشّ عليه الماء بقوة.'],call:'إذا لم يستيقظ خلال دقيقة، أو حدث بعد ألم صدر أو إصابة رأس، أو عند حامل أو مريض قلب أو سكري، أو تكرر.',kw:'اغماء دوخة اغماءة فقدان وعي سقوط'},
{id:'recov',c:'sudden',ic:'🛌',t:'وضعية الإفاقة (للفاقد وعيه الذي يتنفس)',sev:2,sum:'شخص فاقد وعي لكنه يتنفس بشكل طبيعي.',
steps:['اركع بجانبه وضع ذراعه القريبة بزاوية قائمة مع جسمه.','ضع ظهر يده البعيدة على خدّه القريب منك وأمسكها.','اثنِ ركبته البعيدة وسحبها لتقلبه نحوك على جنبه.','أمِل رأسه للخلف قليلاً لفتح مجرى الهواء، وثبّت وضعية الركبة.','راقب تنفسه باستمرار وانتظر الإسعاف.'],
dont:['لا تتركه وحده.'],call:'اتصل بالإسعاف.',kw:'وضعية الافاقة على جنبه فاقد الوعي'},
{id:'heartatk',c:'heart',ic:'💔',t:'نوبة قلبية (احتشاء)',sev:3,sum:'ألم أو ضغط في الصدر قد ينتشر للذراع أو الفك أو الظهر، مع تعرّق وضيق نفَس وغثيان.',
steps:['اتصل بالإسعاف فوراً ولا تقد السيارة بنفسك.','أجلس المصاب في وضعية مريحة (نصف جالس) وفكّ ملابسه الضيقة وهدّئه.','إذا لم يكن عنده حساسية من الأسبرين ولا يعاني من نزيف، ونصحك مشغّل الإسعاف بذلك: يمضغ حبة أسبرين للبالغين (لا تعطه أسبرين إذا كان طفلاً).','إذا كان لديه دواء نيتروغليسرين موصوف له، ساعده على استعماله حسب وصفة طبيبه.','راقب الوعي والتنفس، وإذا فقد الوعي ولم يتنفس ابدأ الإنعاش القلبي الرئوي واستخدم جهاز الصدمات.'],
dont:['لا تتركه وحده.','لا تدعه يمشي أو يبذل مجهوداً.','لا تعطه طعاماً أو ماءً كثيراً.'],call:'دائماً. الأعراض عند النساء وكبار السن والسكريين قد تكون خفيفة (تعب شديد، ضيق نفَس، غثيان).',kw:'نوبة قلبية الم صدر جلطة احتشاء ذبحة'},
{id:'stroke',c:'sudden',ic:'🧠',t:'سكتة دماغية (جلطة أو نزيف دماغي)',sev:3,sum:'ضعف مفاجئ بالوجه أو الذراع أو الكلام.',
steps:['تذكّر FAST: الوجه (انحراف عند الابتسام)، الذراع (لا يرفع ذراعيه)، الكلام (ثقل أو غير مفهوم)، الوقت (اتصل فوراً).','اتصل بالإسعاف وسجّل الوقت الذي بدأت فيه الأعراض بدقة.','اجعله جالساً أو مستلقياً ورأسه مرفوع قليلاً.','لا تعطه أي طعام أو شراب أو دواء بالفم لأنه قد يختنق.','إذا فقد الوعي وهو يتنفس: وضعية الإفاقة.'],
dont:['لا تنتظر زوال الأعراض.','لا تعطه أسبرين أو أدوية الضغط إلا بتوجيه الطبيب.'],call:'دائماً، فكل دقيقة تهم.',kw:'سكتة دماغية جلطة شلل وجه كلام fast'},
{id:'seiz',c:'sudden',ic:'⚡',t:'نوبة صرع / تشنجات',sev:2,sum:'تشنجات وارتعاش مع فقدان الوعي.',
steps:['أبعد الأشياء الحادة والصلبة من حوله، وضع شيئاً ناعماً تحت رأسه.','سجّل وقت بداية النوبة.','فكّ الملابس حول الرقبة.','بعد توقف التشنجات اقلبه على جنبه (وضعية الإفاقة) وابقَ معه حتى يستيقظ تماماً.','طمئنه عندما يستعيد وعيه فقد يكون مرتبكاً.'],
dont:['لا تضع شيئاً في فمه ولا ملعقة.','لا تمسكه ولا تقيّد حركته.','لا تعطه ماءً حتى يستيقظ تماماً.'],call:'نوبة أطول من 5 دقائق، أو نوبات متتالية، أو لا يستيقظ بعدها، أو إصابة أثناء النوبة، أو أول نوبة في حياته، أو حامل، أو بعد غرق.',kw:'صرع تشنج نوبة ارتعاش'},
{id:'asthma',c:'heart',ic:'🫁',t:'نوبة ربو / ضيق نفَس حاد',sev:3,sum:'صفير وسعال وصعوبة في التنفس.',
steps:['اجعله جالساً منتصباً مع ميلان خفيف للأمام وهدّئه.','ساعده على استعمال بخاخ الإسعاف (الفنتولين) الخاص به حسب وصفة طبيبه.','تنفّس بطيء وعميق، وتأكد من تهوية جيدة وابتعاده عن مسبب النوبة (غبار، دخان، حيوانات).','إذا لم يتحسن خلال دقائق أو ازداد سوءاً اتصل بالإسعاف.'],
dont:['لا تجعله يستلقي.','لا تتركه وحده.'],call:'عدم القدرة على الكلام بجمل كاملة، زرقة الشفاه، تعب شديد، أو عدم التحسن بعد البخاخ.',kw:'ربو ضيق نفس صفير تنفس بخاخ'},
{id:'allergy',c:'sudden',ic:'🐝',t:'حساسية شديدة (صدمة تأقية)',sev:3,sum:'تورم الوجه واللسان، ضيق تنفس، طفح جلدي، دوخة بعد طعام أو دواء أو لسعة.',
steps:['اتصل بالإسعاف فوراً.','إذا كان معه حقنة أدرينالين (إيبينفرين) فاحقنها في الفخذ الخارجية فوراً حسب التعليمات المرفقة بها.','أجلسه إذا كان يتنفس بصعوبة، أو أرقده مع رفع ساقيه إذا كان شاحباً.','ابقَ معه، وإذا لم يتحسن خلال 5 إلى 15 دقيقة أو عاد، قد يلزم حقنة ثانية حسب إرشاد الطبيب والإسعاف.','إذا فقد الوعي ولم يتنفس: إنعاش قلبي رئوي.'],
dont:['لا تنتظر ظهور تحسّن قبل طلب المساعدة.','لا تعطه شيئاً بالفم إذا كان يتنفس بصعوبة.'],call:'دائماً حتى لو تحسن بعد الحقنة.',kw:'حساسية تورم لسان تأق صدمة ادرينالين لسعة نحل فول سوداني'},
{id:'poison',c:'poison',ic:'🧪',t:'تسمم بالبلع (أدوية، منظفات، مواد)',sev:3,sum:'ابتلاع مادة سامة أو جرعة زائدة من دواء.',
steps:['أبعد المادة عن متناول المصاب وتأكد أنه يتنفس.','اتصل بالإسعاف أو بمركز السموم المحلي وأخبرهم باسم المادة والكمية التقريبية والوقت.','احتفظ بعبوة المادة أو الدواء وخذها معك للمستشفى.','إذا وصلت المادة للجلد أو العين: اشطفها بماء جارٍ لمدة 15 إلى 20 دقيقة.','إذا كان فاقد الوعي ويتنفس: وضعية الإفاقة، وإن توقف التنفس: إنعاش.'],
dont:['لا تحاول إجباره على التقيؤ.','لا تعطه حليباً أو ماءً كثيراً إلا بتوجيه من مركز السموم.','لا تعطِ شيئاً بالفم لفاقد الوعي.'],call:'دائماً، حتى لو بدا بخير.',kw:'تسمم ابتلاع دواء جرعة زائدة منظف كلور مبيد'},
{id:'co',c:'poison',ic:'🏠',t:'تسمم بأول أكسيد الكربون (مدافئ ومولدات)',sev:3,sum:'صداع ودوخة وغثيان ونعاس في مكان مغلق فيه مدفأة أو مولّد أو فحم.',
steps:['أخرج الجميع فوراً إلى الهواء الطلق وافتح الأبواب والنوافذ إن كان ذلك آمناً.','أطفئ مصدر الغاز أو المدفأة أو المولّد ولا تعد للمكان.','اتصل بالإسعاف.','إذا كان فاقد الوعي ويتنفس: وضعية الإفاقة، وإذا لم يتنفس: إنعاش.'],
dont:['لا تعتمد على الرائحة، فالغاز بلا رائحة.','لا تنم أبداً في غرفة مغلقة فيها مدفأة غاز أو حطب أو فحم مشتعل أو مولّد.'],call:'دائماً. حتى لو تحسّنت الأعراض بالهواء النقي يجب فحصه.',kw:'غاز اختناق مدفأة فحم مولد كهرباء co صداع نعاس'},
{id:'snake',c:'poison',ic:'🐍',t:'لدغة أفعى',sev:3,sum:'لدغة مع أثر نابين وألم وتورم.',
steps:['ابتعد عن الأفعى بهدوء، ولا تحاول قتلها أو الإمساك بها (صورة من بعيد إن أمكن).','طمئن المصاب واجعله ساكناً قدر الإمكان، فالحركة تسرّع انتشار السم.','أبقِ العضو المصاب أخفض أو بمستوى القلب، وانزع الخواتم والساعات والملابس الضيقة قبل التورم.','ثبّت العضو برباط ضاغط واسع ومرن (ليس شديداً) أو بجبيرة.','انقله للمستشفى بأسرع وقت للحصول على المصل المضاد، واتصل بالإسعاف.'],
dont:['لا تشقّ الجرح ولا تمص السم.','لا تضع رباطاً شديداً (تورنيكيه) ولا ثلجاً ولا كهرباء.','لا تعطه كحولاً أو مشروبات منبهة.','لا تحرق مكان اللدغة ولا تضع أعشاباً.'],call:'دائماً.',kw:'افعى ثعبان لدغة سم حية'},
{id:'scorp',c:'poison',ic:'🦂',t:'لسعة عقرب أو حشرات',sev:2,sum:'ألم حارق وتورم موضعي.',
steps:['اغسل مكان اللسعة بماء وصابون، وضع كمادة باردة.','أبقِ العضو ساكناً وبمستوى القلب.','في لسعات النحل: أزل الإبرة بكشطها بحافة بطاقة أو ظفر.','راقب ظهور أعراض عامة: تعرّق، تقيؤ، تغير النبض، ضيق نفَس، تورم الوجه.','انقله للمستشفى فوراً إذا كان طفلاً أو مسنّاً أو ظهرت أعراض عامة أو كانت اللسعة عقرباً.'],
dont:['لا تشقّ مكان اللسعة ولا تمص السم.','لا تضع ثوماً أو بصلاً أو معجوناً عليه.'],call:'أعراض عامة، لسعات متعددة، أو أي علامة حساسية (راجع: حساسية شديدة).',kw:'عقرب لسعة نحل دبور حشرة زنبور'},
{id:'bite',c:'poison',ic:'🐕',t:'عضة كلب أو حيوان',sev:2,sum:'عضة من كلب أو قطة أو حيوان بري.',
steps:['اغسل الجرح فوراً بالماء الجاري والصابون لمدة 15 دقيقة على الأقل.','اضغط لإيقاف النزيف وغطّه بضمادة نظيفة.','راجع الطبيب أو المركز الصحي في نفس اليوم لتقييم الحاجة للقاح السعار والكزاز والمضاد الحيوي.','حاول معرفة حالة الحيوان (مملوك، ملقّح، يمكن مراقبته 10 أيام) دون المخاطرة بنفسك.'],
dont:['لا تغلق الجرح بإحكام ولا تضع مواد منزلية.','لا تؤخر المراجعة بانتظار ظهور أعراض فالسعار قاتل بعد ظهورها.'],call:'الأمر مستعجل: عضة الوجه والرقبة، جرح عميق، حيوان بري أو مجهول أو يتصرف بغرابة.',kw:'عضة كلب قطة سعار حيوان مسعور'},
{id:'heatstroke',c:'heat',ic:'☀️',t:'ضربة شمس وإنهاك حراري',sev:3,sum:'حرارة جسم عالية، جلد حار وجاف أو متعرق، دوخة، ارتباك، غثيان.',
steps:['انقله فوراً إلى مكان بارد ومظلل واتصل بالإسعاف إذا ظهر ارتباك أو إغماء أو حرارة شديدة.','فكّ أو انزع الملابس الزائدة.','برّد جسمه بالماء البارد: مناشف مبللة، رشّ ماء، مروحة، وضع كمادات باردة على الرقبة والإبط والفخذين.','إذا كان واعياً أعطه ماءً بارداً ببطء بجرعات صغيرة (يفضل مع قليل من الأملاح).','راقبه حتى وصول المساعدة.'],
dont:['لا تعطه ماءً وهو فاقد الوعي.','لا تعطه أدوية خافضة للحرارة فهي لا تنفع في ضربة الشمس.'],call:'ارتباك، إغماء، تشنج، حرارة أعلى من 40°م، عدم التعرّق مع جلد حار.',kw:'ضربة شمس حر اجهاد حراري ارتفاع حرارة'},
{id:'hypo',c:'heat',ic:'🥶',t:'انخفاض حرارة الجسم (تجمّد)',sev:3,sum:'رجفة شديدة ثم تلعثم وارتباك وبطء، في البرد أو بعد الغرق في ماء بارد.',
steps:['انقله لمكان دافئ وجاف وأبعده عن الرياح والأرض الباردة.','انزع الملابس المبللة وغطّه بالبطانيات والملابس الجافة مع تغطية الرأس.','إذا كان واعياً أعطه مشروباً دافئاً حلواً (ليس ساخناً جداً) وطعاماً سكرياً.','ضع زجاجات ماء دافئ ملفوفة بقماش على الصدر والإبط والفخذين (ليس على الأطراف).','تعامل معه بلطف شديد، فالحركة العنيفة قد تسبب اضطراب القلب.'],
dont:['لا تدلّك الأطراف بقوة.','لا تستخدم حمّاماً ساخناً أو نار مباشرة.','لا تعطه كحولاً.'],call:'ارتباك، توقف الرجفة، نعاس، أو فقدان وعي.',kw:'برد تجمد انخفاض حرارة صقيع ثلج'},
{id:'sugar',c:'sudden',ic:'🍬',t:'هبوط سكر الدم (مريض السكري)',sev:2,sum:'رجفة وتعرق وجوع وارتباك وشحوب عند مريض سكري.',
steps:['إن كان واعياً: أعطه 15 إلى 20 غراماً من السكر سريع الامتصاص: عصير فواكه أو كوب من مشروب سكري عادي أو ملعقتا سكر مذابتان.','أعد قياس السكر بعد 15 دقيقة، وكرر إن لم يتحسن.','بعد التحسن أعطه وجبة خفيفة تحتوي نشويات.','إذا فقد الوعي أو لم يستطع البلع: لا تعطه شيئاً بالفم، اقلبه على جنبه واتصل بالإسعاف.'],
dont:['لا تعطه الأنسولين.','لا تضع الطعام في فمه وهو فاقد الوعي.'],call:'فقدان الوعي، تشنج، عدم التحسن بعد جرعتين من السكر.',
note:'ارتفاع السكر الشديد (عطش شديد، تبوّل، نفَس برائحة الأسيتون، قيء، نعاس) حالة طبية عاجلة تحتاج مستشفى.',kw:'سكر هبوط سكري انسولين سكر الدم'},
{id:'drown',c:'heart',ic:'🌊',t:'غرق',sev:3,sum:'شخص أُخرج من الماء ولا يستجيب.',
steps:['لا تعرّض نفسك للغرق: استخدم حبلاً أو عصا أو طوقاً أو قارباً، ولا تقفز إلا إذا كنت مدرباً.','اتصل بالإسعاف.','عند الإخراج: تأكد من وعيه وتنفسه، وابدأ بخمسة أنفاس إنقاذ ثم الإنعاش القلبي الرئوي (30 ضغطة : 2 نفَس).','لا تحاول إخراج الماء من الرئتين بالضغط على البطن.','دفّئه بعد عودة التنفس، وضعه على جنبه إذا استفرغ.'],
dont:['لا تتوقف عن الإنعاش.'],call:'دائماً، وكل من ابتلع ماءً وسعل يجب أن يُراقب لأن الأعراض قد تتأخر.',kw:'غرق ماء سباحة بحر نهر'},
{id:'elec',c:'sudden',ic:'🔌',t:'صعقة كهربائية',sev:3,sum:'تعرض لتيار كهربائي.',
steps:['لا تلمس المصاب قبل فصل التيار من القاطع الرئيسي.','إذا تعذر الفصل، أبعد المصدر باستخدام جسم جاف وغير موصل (عصا خشبية جافة) وأنت واقف على مادة عازلة.','اتصل بالإسعاف، وتحقق من التنفس والنبض وابدأ الإنعاش إذا لزم.','عالج الحروق بتبريدها وتغطيتها (راجع: الحروق).'],
dont:['لا تقترب من أسلاك التوتر العالي المتساقطة (ابتعد 10 أمتار على الأقل).','لا تستخدم الماء أو معدن.'],call:'دائماً، حتى لو بدا بخير، فقد تحدث اضطرابات قلبية متأخرة.',kw:'صعق كهرباء تيار صدمة كهربائية'},
{id:'eye',c:'bleed',ic:'👁️',t:'إصابة العين (مواد كيميائية أو جسم غريب)',sev:2,sum:'ألم واحمرار ودموع بعد دخول مادة أو جسم إلى العين.',
steps:['المواد الكيميائية: اشطف العين فوراً بماء جارٍ نظيف لمدة 15 إلى 20 دقيقة مع إبقاء الجفون مفتوحة، ثم اذهب للمستشفى.','جسم صغير (غبار أو رمش): اشطف بالماء، أو اسحب الجفن العلوي فوق السفلي ليطرد الدمع الجسم.','غطّ العين بضمادة نظيفة وراجع طبيب العيون عند استمرار الألم أو ضبابية الرؤية.'],
dont:['لا تفرك العين.','لا تنزع جسماً مغروزاً في العين، ثبّته بكوب ورقي وغطِّ العين الأخرى.'],call:'جسم مغروز، جرح بالعين، مادة كيميائية، رؤية مضطربة، ألم شديد.',kw:'عين احمرار مادة غبار كيماويات جسم غريب'},
{id:'shock',c:'sudden',ic:'😰',t:'الصدمة (هبوط الدورة الدموية)',sev:3,sum:'شحوب وجلد بارد ورطب ونبض سريع وضعيف ودوخة بعد نزيف أو إصابة.',
steps:['اتصل بالإسعاف.','عالج السبب الواضح (نزيف، حرق…).','أرقده على ظهره وارفع ساقيه نحو 30 سم إلا إذا كان لديه كسر في الساقين أو الرأس أو الظهر.','غطّه ليبقى دافئاً وفكّ الملابس الضيقة.','راقب الوعي والتنفس حتى وصول المساعدة.'],
dont:['لا تعطه طعاماً أو شراباً.','لا تتركه وحده.'],call:'دائماً.',kw:'صدمة شحوب نبض سريع هبوط ضغط'},
{id:'abd',c:'sudden',ic:'🤢',t:'ألم بطن حاد / جفاف وإسهال',sev:2,sum:'ألم شديد بالبطن أو قيء وإسهال شديدان.',
steps:['اجعله في وضع مريح ولا تعطه مسكنات قوية قبل التشخيص.','عند القيء والإسهال: عوّض السوائل بجرعات صغيرة متكررة من محلول الإماهة (راجع: محلول الإماهة المنزلي في قسم البرية).','راقب علامات الجفاف: جفاف الفم، قلة البول، دوخة، عيون غائرة، وعند الرضّع: يافوخ غائر.'],
dont:['لا تعطه مضادات الإسهال للأطفال دون استشارة.','لا تضع كمادة ساخنة على بطن ألمه حاد غير معروف السبب.'],call:'ألم شديد أو مستمر، بطن متصلب، دم في القيء أو البراز، قيء أخضر، حرارة عالية، أو جفاف عند طفل أو مسنّ أو حامل.',kw:'بطن مغص اسهال قيء جفاف زائدة'},
{id:'fever',c:'kids',ic:'🧒',t:'حمى عند الأطفال',sev:2,sum:'حرارة جسم الطفل أعلى من 38°م.',
steps:['قس الحرارة بميزان حرارة موثوق، وألبس الطفل ملابس خفيفة وحافظ على جو معتدل.','أعطه سوائل بكثرة وراحة.','يمكن استخدام خافض حرارة مناسب لوزنه وعمره حسب نشرة الدواء أو توجيه الطبيب أو الصيدلاني.','يمكن مسحه بماء فاتر (ليس بارداً).'],
dont:['لا تستخدم الكحول ولا الماء المثلج.','لا تعطِ الأسبرين للأطفال.','لا تغطّه بطبقات كثيرة.'],call:'أي حمى عند رضيع أقل من 3 أشهر فوراً. وأيضاً: تشنج حموي، طفح لا يختفي بالضغط، تيبّس الرقبة، صعوبة تنفس، خمول شديد، رفض الشرب، حمى أكثر من 3 أيام.',kw:'حمى حرارة طفل سخونة تشنج حموي'},
{id:'childchoke',c:'kids',ic:'🍼',t:'ابتلاع جسم غريب (طفل): بطارية، مغناطيس، عملة',sev:3,sum:'طفل ابتلع بطارية زر أو مغناطيسات أو أجسام حادة.',
steps:['إذا كان يختنق: راجع «الاختناق».','إذا ابتلع بطارية زر: اذهب للطوارئ فوراً حتى بدون أعراض (قد تسبب حروقاً داخلية خلال ساعتين).','المغناطيسات المتعددة والأجسام الحادة: طوارئ فوراً.','لا تدعه يأكل أو يشرب حتى يفحصه الطبيب.'],
dont:['لا تحاول إحداث القيء.','لا تنتظر ظهور الأعراض.'],call:'فوراً.',kw:'طفل بلع بطارية عملة مغناطيس جسم غريب'},
{id:'labor',c:'sudden',ic:'🤰',t:'ولادة طارئة (قبل وصول المساعدة)',sev:3,sum:'امرأة حامل ولادتها وشيكة ولا يمكن الوصول لمستشفى.',
steps:['اتصل بالإسعاف، واحضر مناشف نظيفة وأغطية.','اجعلها في وضعية مريحة (نصف جالسة أو على الجانب) وهدّئها، واغسل يديك.','دعها تدفع مع الانقباضات ولا تسحب الطفل. ادعم رأسه برفق عند خروجه.','إذا كان الحبل السري ملتفاً حول رقبته فانزلقه برفق فوق الرأس.','جفّف الطفل وضعه على صدر أمه ملتصقاً بجلدها وغطّهما معاً.','انتظر خروج المشيمة، ولا تشدّ الحبل. يمكن ربط الحبل وقطعه بأدوات معقّمة فقط، أو الانتظار لوصول الإسعاف.','دلّك بطن الأم برفق بعد خروج المشيمة للمساعدة على تقلص الرحم.'],
dont:['لا تشدّ الحبل السري.','لا تدخل يدك في المهبل.'],call:'دائماً. ونزيف شديد أو طفل لا يتنفس يعني إنعاشاً فورياً (راجع: الإنعاش).',kw:'ولادة طارئة مخاض حامل طفل ولد'}
];
const MYTHS=[['وضع الزبدة أو معجون الأسنان أو البياض على الحرق','يحبس الحرارة ويسبب العدوى. الصحيح: ماء جارٍ فاتر 20 دقيقة.'],['وضع ملعقة أو أي شيء في فم مصاب بالصرع','قد يكسر الأسنان أو يسد الحلق. الصحيح: إبعاد الأخطار وإمالته على جنبه.'],['شقّ مكان لدغة الأفعى ومص السم','يزيد النزيف والعدوى ولا يخرج السم. الصحيح: تثبيت العضو ونقله للمستشفى.'],['رباط شديد (تورنيكيه) فوق لدغة الأفعى','قد يسبب فقد العضو. الصحيح: رباط مرن ضاغط خفيف.'],['إرجاع الرأس للخلف عند الرعاف','يبتلع الدم ويسبب الغثيان. الصحيح: الانحناء للأمام والضغط على الأنف.'],['فرك الأطراف المتجمدة بقوة أو التدفئة بنار مباشرة','يضر الأنسجة ويؤذي القلب. الصحيح: تدفئة تدريجية بالأغطية.'],['إجبار المتسمم على التقيؤ أو إعطائه حليباً','قد يسبب اختناقاً أو حرقاً جديداً. الصحيح: الاتصال بمركز السموم والذهاب للمستشفى.'],['الأسبرين لخفض حرارة الطفل','قد يسبب متلازمة راي. استخدم الدواء المناسب بتوجيه طبي.'],['صبّ الماء البارد جداً أو الثلج على الحرق','يزيد تلف الأنسجة. الصحيح: ماء جارٍ فاتر إلى بارد.'],['ضرب المغمى عليه على وجهه ليستيقظ','لا فائدة منه. الصحيح: رفع الساقين وتأمين التنفس.'],['تحريك مصاب الحادث بسرعة','قد يفاقم إصابة العمود الفقري. الصحيح: تثبيته وانتظار الإسعاف إلا للخطر المباشر.'],['وضع القهوة أو التراب على الجروح','تسبب التهاباً وكزازاً. الصحيح: الماء والصابون وضمادة نظيفة.']];
const WILD=[
{id:'w_splint',ic:'🪵',t:'جبيرة من مواد الطبيعة',sum:'عند الكسر بعيداً عن المستشفى.',
steps:['استخدم عصيّاً مستقيمة أو لحاء شجر أو لوحاً أو حقيبة ظهر مطويّة أو بطانية ملفوفة.','ضع حشوة (ملابس، عشب جاف) بين الجبيرة والجلد خاصة فوق نتوءات العظام.','اجعل الجبيرة تتجاوز المفصل فوق الكسر والمفصل تحته.','اربطها بقماش أو أحزمة أو أربطة الأحذية بشكل مريح دون أن تقطع الدورة الدموية، وافحص الأصابع كل 15 دقيقة.','ذراع: علّقها بوشاح مثلث من قميص أو قماش. ساق: اربطها إلى الساق السليمة.'],warn:'الهدف التثبيت فقط. اطلب النجدة وانقل المصاب للمستشفى.'},
{id:'w_dress',ic:'🧵',t:'ضمادات وربط من الملابس',sum:'عند غياب أدوات الإسعاف.',
steps:['اختر قماشاً قطنياً نظيفاً قدر الإمكان (قميص أو منديل)، ويفضّل غليه أو كيّه بالحرارة قبل الاستخدام إن أمكن.','استخدمه كضغط مباشر على الجرح ثم اربط فوقه بشريط عريض من القماش.','الوشاح المثلث: قص قطعة قماش مربعة قطرياً وتستخدم كرباط للذراع أو للرأس.','لا تلفّ الربط بحيث يقطع الدورة، وافحص الأطراف.'],warn:'لا تستخدم أوراق الشجر أو الطين على الجروح المفتوحة.'},
{id:'w_water',ic:'💧',t:'تنقية ماء الشرب في الطبيعة',sum:'ماء الأنهار والينابيع قد يحمل جراثيم وطفيليات.',
steps:['الأفضل الغلي: غلياناً قوياً لمدة دقيقة واحدة (3 دقائق فوق ارتفاع 2000 م) ثم تبريده.','إذا لم يتوفر الغلي: رشّح الماء بقماش نظيف لإزالة العكارة، ثم استخدم أقراص تعقيم الماء حسب تعليمات الشركة المصنّعة.','اترك الماء ليستقر ثم اسكب الرائق ببطء.','لا تشرب من ماء راكد ملوّث أو قرب ماشية أو مخلفات مصانع.'],warn:'الماء الصافي ليس بالضرورة نظيفاً. لا تشرب ماء البحر ولا البول.'},
{id:'w_ors',ic:'🥤',t:'محلول الإماهة المنزلي (للإسهال والجفاف)',sum:'يعوّض السوائل والأملاح عند الإسهال أو التعرق الشديد.',
steps:['اغلِ ماء الشرب ثم برّده، قياس لتر واحد.','أضف 6 ملاعق صغيرة (مستوية) من السكر ونصف ملعقة صغيرة من الملح.','حرّك حتى يذوب تماماً.','قدّمه للمصاب بجرعات صغيرة متكررة (رشفات)، والرضّع بملعقة صغيرة أو قطّارة كل دقيقة تقريباً.','استمر بالرضاعة الطبيعية للرضّع، وتخلّص من أي محلول متبقٍ بعد 24 ساعة.'],warn:'لا تزد على كمية الملح، فالتركيز الزائد يضر. المركزات الجاهزة (ORS) أفضل إن توفرت. راجع الطبيب إذا استمر الإسهال أو ظهر دم.'},
{id:'w_fire',ic:'🔥',t:'الدفء والمأوى عند البرد الشديد',sum:'لتفادي انخفاض حرارة الجسم.',

function der2raw(d){if(d[0]!==0x30)return null;let i=2;if(d[1]&0x80)i=2+(d[1]&0x7f);const rd=()=>{if(d[i]!==2)return null;let l=d[i+1];i+=2;let v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]===0)v=v.slice(1);const o=new Uint8Array(32);o.set(v,32-v.length);return o};const r=rd(),s=rd();if(!r||!s)return null;const o=new Uint8Array(64);o.set(r);o.set(s,32);return o}
async function verifyCode(code){const m=code.trim().match(/^([A-Za-z0-9]+)-([A-Za-z0-9_-]+)$/);if(!m||!crypto.subtle)return null;let sig=b64(m[2]);if(sig.length!==64)sig=der2raw(sig);if(!sig)return null;
const key=await crypto.subtle.importKey('spki',b64(PUB),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,sig,new TextEncoder().encode(S.did+'|'+m[1]));return ok?m[1]:null}

function ppgAnalyze(samples){const S0=samples.filter(s=>s[0]>=3000);if(S0.length<150)return null;const t0=S0[0][0],tn=S0[S0.length-1][0];if(tn-t0<10000)return null;const fs=30,n=Math.floor((tn-t0)/1000*fs),x=new Array(n);let j=0;for(let i=0;i<n;i++){const t=t0+i*1000/fs;while(j<S0.length-2&&S0[j+1][0]<t)j++;const a=S0[j],b=S0[j+1],u=b[0]===a[0]?0:(t-a[0])/(b[0]-a[0]);x[i]=a[1]+(b[1]-a[1])*Math.min(1,Math.max(0,u))}
const ma=(arr,w)=>{const o=new Array(arr.length);let s=0,c=0;const h=Math.floor(w/2);for(let i=0;i<arr.length;i++){s=0;c=0;for(let k=Math.max(0,i-h);k<=Math.min(arr.length-1,i+h);k++){s+=arr[k];c++}o[i]=s/c}return o};

let pk=[];for(let i=2;i<n-2;i++){if(sm[i]>sm[i-1]&&sm[i]>=sm[i+1]&&sm[i]>0.25*sd){if(pk.length&&i-pk[pk.length-1]<10){if(sm[i]>sm[pk[pk.length-1]])pk[pk.length-1]=i}else pk.push(i)}}

const LN=()=>{const C=window.Capacitor;if(!C)return null;try{if(C.Plugins&&C.Plugins.LocalNotifications)return C.Plugins.LocalNotifications;if(C.isNativePlatform&&C.isNativePlatform()&&C.registerPlugin)return LN._p||(LN._p=C.registerPlugin('LocalNotifications'))}catch(e){}return null};

function timesOf(s){const o=[];String(norm(s)).replace(/(\d{1,2})\s*[:.]\s*(\d{2})/g,(m,h,mi)=>{h=+h;mi=+mi;if(h<24&&mi<60)o.push(D2(h)+':'+D2(mi))});return [...new Set(o)].slice(0,4)}
async function syncNotifs(){const ln=LN();if(!ln)return;try{const pm=await ln.checkPermissions();if(pm.display!=='granted')return;const pend=await ln.getPending();if(pend.notifications&&pend.notifications.length)await ln.cancel({notifications:pend.notifications});
const now=Date.now(),L=[],[th,tmn]=(S.set.tm||'09:00').split(':').map(Number);
for(const r of S.rem){const who=S.people.length>1?(person(r.pid)||{}).name:'';const body=(r.title+(r.note?' — '+r.note:'')+(who?' ('+who+')':''));
if(r.type==='med'){(r.times||[]).forEach((t,i)=>{const[h,m]=t.split(':').map(Number);if((r.days||[]).length>=7||!(r.days||[]).length)L.push({id:r.id*100+i*8+7,title:'💊 تذكير دواء',body,schedule:{on:{hour:h,minute:m},allowWhileIdle:true}});else r.days.forEach((d,di)=>L.push({id:r.id*100+i*8+di,title:'💊 تذكير دواء',body,schedule:{on:{weekday:d,hour:h,minute:m},allowWhileIdle:true}}))})}
else{if(r.at-2*36e5>now)L.push({id:r.id*100,title:'📅 موعد قريب',body,schedule:{at:new Date(r.at-2*36e5),allowWhileIdle:true}});const dd=new Date(r.at);dd.setDate(dd.getDate()-1);dd.setHours(18,0,0,0);if(dd.getTime()>now)L.push({id:r.id*100+1,title:'📅 موعدك غداً',body,schedule:{at:dd,allowWhileIdle:true}})}}
for(const x of S.pharm){if(!x.exp)continue;[30,7,0].forEach((off,i)=>{const d=new Date(x.exp);d.setDate(d.getDate()-off);d.setHours(th,tmn,0,0);if(d.getTime()>now)L.push({id:100000000+x.id*10+i,title:'🧴 صيدلية المنزل',body:off===0?x.name+' تنتهي صلاحيته اليوم':x.name+' تنتهي صلاحيته بعد '+off+' يوماً',schedule:{at:d,allowWhileIdle:true}})})}
if(L.length)await ln.schedule({notifications:L})}catch(e){console.warn('notif',e)}}

case 'delph':if(confirm('حذف هذا الدواء من القائمة؟')){S.pharm=S.pharm.filter(x=>x.id!==+d.id);save();openPharm();render()}break;
case 'set':openSet();break;
case 'saveset':{const cl=x=>x.replace(/[^\d+*#]/g,'');S.set.cc=val('scc');S.set.amb=cl(val('sa'))||'112';S.set.fire=cl(val('sf'))||S.set.amb;S.set.pol=cl(val('sp2'))||S.set.amb}S.set.tm=val('stm')||'09:00';S.set.theme=val('sth');applyTheme();save();closeM();render();break;
case 'bak':openBak();break;
case 'cpbk':{const t=$('#bk');t.select();try{await navigator.clipboard.writeText(t.value);toast('تم النسخ')}catch(x){try{document.execCommand('copy');toast('تم النسخ')}catch(y){}}}break;
case 'rest':{try{const j=JSON.parse(val('rs'));if(!Array.isArray(j.people))throw 0;if(!confirm('ستُستبدل بياناتك الحالية. متابعة؟'))break;S.people=j.people;S.vitals=j.vitals||[];S.rem=j.rem||[];S.pharm=j.pharm||[];if(j.set)S.set=Object.assign(S.set,j.set);S.cur=S.people[0]?S.people[0].id:null;S.nid=Math.max(S.nid,...[].concat(S.people,S.vitals,S.rem,S.pharm).map(x=>(x.id||0)+1));save();closeM();render();toast('تم الاسترجاع')}catch(x){toast('النسخة غير صالحة')}}break;
case 'dmsg':openDocMsg(d.id);break;
case 'dsit':{dm.sit=dm.sit===d.s?'':d.s;dm.w=$('#dmv')?$('#dmv').checked:dm.w;openDocMsg(dm.pid,true)}break;
case 'dwa':case 'dsms':case 'dcp':{const p=person(+d.id);dm.w=$('#dmv').checked;const t=msgText(p,dm.sit,val('dmd'),dm.w);if(a==='dwa')window.open('https://wa.me/'+waNum(p.docp)+'?text='+encodeURIComponent(t),'_blank');else if(a==='dsms')window.location.href='sms:'+String(p.docp).replace(/[^\d+]/g,'')+'?body='+encodeURIComponent(t);else{try{await navigator.clipboard.writeText(t);toast('تم النسخ')}catch(x){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('تم النسخ')}catch(y){}ta.remove()}}}break;
case 'about':openAbout();break;
case 'contact':openContact();break;
case 'obagree':S.agreed=Date.now();save();ob={s:'count',n:1,i:0};renderOb();break;
case 'obn':ob.n=+d.n;ob.warn=false;renderOb();break;
case 'obtw':ob.n=FREE_P;ob.warn=false;obStartP();break;
case 'obgo':if(ob.n>FREE_P&&!S.pro){ob.warn=true;renderOb();break}obStartP();break;
case 'obnext':{const p=readPerson(ob.cur,false),m=$('#omsg');if(!p.name){m.textContent='اكتب الاسم';break}if(p.by==null){m.textContent='اكتب العمر بشكل صحيح';break}S.people.push(p);if(!S.cur)S.cur=p.id;save();ob.i++;if(ob.i<ob.n)obStartP();else{S.onb=true;save();ob=null;view='home';render();window.scrollTo(0,0);toast('تم حفظ البيانات ✔')}}break;
}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#res').innerHTML=q.trim()?resHtml():quick()}});
document.addEventListener('change',e=>{if(e.target.id==='agree'){$('#agreeBtn').disabled=!e.target.checked}if(e.target.id==='scc'){const k=COUNTRIES.find(c=>c[0]===e.target.value);if(k){$('#sa').value=k[3];$('#sf').value=k[4];$('#sp2').value=k[5]}}if(e.target.id==='dmv'){dm.w=e.target.checked;openDocMsg(dm.pid,true)}if(e.target.id==='vp'){S.cur=+e.target.value;save();render()}if(e.target.id==='rt'){remType=e.target.value;$('#rmed').style.display=remType==='med'?'':'none';$('#rap').style.display=remType==='appt'?'':'none'}});
function applyTheme(){const t=S.set.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
window.ppgAnalyze=ppgAnalyze;
applyTheme();if(S.people.length&&S.agreed&&!S.onb)S.onb=true;if(!S.cur&&S.people[0])S.cur=S.people[0].id;save();render();
</script></body></html>
